name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: |
          pip install buildozer cython==0.29.33
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev cmake libltdl-dev

      - name: Собрать APK
        run: |
          yes | buildozer android debug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: mybot-apk
          path: bin/*.apk
